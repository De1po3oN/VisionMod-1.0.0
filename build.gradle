plugins { id 'fabric-loom' version '1.17.20'; id 'maven-publish' }
version = '2.0.0'
group = 'com.visionmod'
base { archivesName = 'visionmod' }
repositories {
 mavenCentral()
 maven {
  name = 'BlameJared'
  url = 'https://maven.blamejared.com'
 }
 maven {
  name = 'Modrinth'
  url = 'https://api.modrinth.com/maven'
  content { includeGroup 'maven.modrinth' }
 }
}
dependencies {
 minecraft 'com.mojang:minecraft:1.21.11'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.19.3'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
 // JEI for Fabric Minecraft 1.21.11, bundled as nested mod.
 modImplementation 'maven.modrinth:u6dRKJwZ:1MYoCSWP'
 include 'maven.modrinth:u6dRKJwZ:1MYoCSWP'
 // JEI 27.54.0.113 requires mezz_config >=0.6.3,<1.0.0.
 // Bundle the matching Fabric 1.21.11 library as a separate nested mod.
 modImplementation 'net.mezzdev.config:mezz_config-1.21.11-fabric:0.6.11'
 include 'net.mezzdev.config:mezz_config-1.21.11-fabric:0.6.11'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

// Optional, isolated render tests. Test classes are never included in the mod JAR.
if (providers.gradleProperty('visualGameTest').isPresent()) {
 loom { mods { visionmod { sourceSet sourceSets.main } } }
 fabricApi.configureTests {
  createSourceSet = true
  modId = 'visionmod-visual-tests'
  enableGameTests = false
  enableClientGameTests = true
 }
 // This smoke checks rendering, not deterministic packet scheduling. The API's
 // optional network synchronizer is unnecessary for these visual assertions.
 loom.runs.named('clientGameTest') {
  vmArg '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
 }
 tasks.register('inspectMinecraftHooks',JavaExec) {
  dependsOn tasks.named('gametestClasses')
  classpath=sourceSets.gametest.runtimeClasspath
  mainClass='com.visionmod.InspectMinecraftHooks'
 }
}
