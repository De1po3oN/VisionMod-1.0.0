name: Integrated world visual smoke
on:
  push:
    branches: [main, 'codex/visual-refresh']
    paths: ['src/**', 'build.gradle', '.github/workflows/world-visual.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  world-render:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Prepare isolated game test
        run: |
          set +e
          gradle -PvisualGameTest gametestClasses inspectMinecraftHooks downloadAssets --no-daemon --max-workers=2 --console=plain > world-prepare.log 2>&1
          status=$?
          tail -n 70 world-prepare.log
          exit "$status"
      - name: Render enabled modules in a real flat world
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '3.3'
        run: |
          set +e
          xvfb-run -a -s '-screen 0 1280x720x24' timeout --signal=TERM 240s gradle -PvisualGameTest runClientGameTest --no-daemon --console=plain --max-workers=2 > world-client.log 2>&1
          status=$?
          set -e
          tail -n 70 world-client.log
          test "$status" -eq 0
          grep -q '\[VisionMod\]\[WORLDTEST\] PASS:' world-client.log
      - name: Verify real public timed lyrics lookup
        run: |
          set +e
          gradle -PvisualGameTest verifyLiveLyrics --no-daemon --console=plain --max-workers=2 > lyrics-live.log 2>&1
          status=$?
          tail -n 35 lyrics-live.log
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VisionMod-World-Render-QA
          path: |
            world-prepare.log
            world-client.log
            lyrics-live.log
            build/run/clientGameTest/vision-world-captures/**
          if-no-files-found: warn
      - uses: actions/checkout@v4
        if: always()
        with:
          ref: codex/visual-evidence
          path: .qa-evidence
      - name: Retain world evidence
        if: always()
        run: bash tests/publish-evidence.sh world
