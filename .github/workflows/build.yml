
name: Build Vision Mod 2.0.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric 1.21.11 / Java 21
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Verify Gradle version
        run: gradle --version

      - name: Build
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify JEI and MezzConfig are included
        run: |
          python3 - <<'PYCODE'
          import io, json, zipfile

          path = 'build/libs/visionmod-2.0.0.jar'

          with zipfile.ZipFile(path) as outer:
              metadata = json.loads(
                  outer.read('fabric.mod.json')
              )
              assert metadata['version'] == '2.0.0'

              found_jei = False
              found_mezz = False
              for nested in metadata.get('jars', []):
                  with zipfile.ZipFile(
                      io.BytesIO(outer.read(nested['file']))
                  ) as inner:
                      child = json.loads(
                          inner.read('fabric.mod.json')
                      )
                      if child.get('id') == 'jei':
                          found_jei = True
                      if child.get('id') == 'mezz_config':
                          found_mezz = True

              assert found_jei, 'JEI is NOT bundled'
              assert found_mezz, 'MezzConfig dependency is NOT bundled'
          PYCODE

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VisionMod-2.0.0
          path: build/libs/visionmod-2.0.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Check Browser Music Extension scripts and manifest
        run: |
          node --check browser-extension/background.js
          node --check browser-extension/content.js
          node --check browser-extension/options.js
          python3 - <<'PY'
          import json
          manifest=json.load(open("browser-extension/manifest.json", encoding="utf8"))
          assert manifest["manifest_version"]==3
          assert "http://127.0.0.1:38567/*" in manifest["host_permissions"]
          print("Browser extension syntax and manifest PASS")
          PY

      - name: Upload Browser Music Extension
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VisionMod-Browser-Music-Extension
          path: browser-extension/
          if-no-files-found: error
          retention-days: 30
